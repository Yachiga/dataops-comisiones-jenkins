# Alternativa en GitHub Actions. El enunciado pide Azure DevOps o Jenkins; este flujo es opcional.
# Requiere secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, PG_PASSWORD
# y los environments dev / test / prod (prod con "Required reviewers" o "Wait timer").
name: ci-cd-comisiones

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

env:
  CSV_FILE: ComisionEmpleados_V1_202610.csv
  PERIODO: "202610"
  LOCATION: eastus2

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: python -m pytest --junitxml=reports/junit.xml
      - run: python scripts/build_adf_arm.py --check
      - run: PYTHONPATH=src python -m comisiones.pipeline --modo local --empleados-file tests/fixtures/empleados_fixture.csv --csv data/input/$CSV_FILE --salida output
      - uses: actions/upload-artifact@v4
        with: { name: salida-prueba, path: output }

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        entorno: [dev, test, prod]
    environment: ${{ matrix.entorno }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.entorno == 'prod' && github.ref != 'refs/heads/main'
        run: echo "prod solo se despliega desde main" && exit 0
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Desplegar con scripts/deploy.sh
        if: matrix.entorno != 'prod' || github.ref == 'refs/heads/main'
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || format('rg-dataops-{0}', matrix.entorno) }}
          CSV_FILE: ${{ env.CSV_FILE }}
        run: bash scripts/deploy.sh ${{ matrix.entorno }}
