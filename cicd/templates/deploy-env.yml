# Plantilla de despliegue reutilizada para dev / test / prod.
# Toda la lógica vive en scripts/deploy.sh (la misma que usa Jenkins).
# Las aprobaciones se configuran en el Environment de Azure DevOps
# (Pipelines > Environments > dataops-<entorno> > Approvals and checks).
parameters:
  - name: entorno
    type: string
    values: [dev, test, prod]
  - name: dependsOn
    type: string
  - name: condition
    type: string
    default: succeeded()

stages:
  - stage: CD_${{ upper(parameters.entorno) }}
    displayName: 'CD - ${{ parameters.entorno }}'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - deployment: Desplegar
        displayName: 'Desplegar ARM + ADF y prueba de humo (${{ parameters.entorno }})'
        environment: 'dataops-${{ parameters.entorno }}'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: UsePythonVersion@0
                  inputs: { versionSpec: '$(pythonVersion)' }

                - task: AzureCLI@2
                  displayName: 'scripts/deploy.sh ${{ parameters.entorno }}'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: '$(Pipeline.Workspace)/drop/scripts/deploy.sh'
                    arguments: '${{ parameters.entorno }}'
                  env:
                    PG_PASSWORD: $(PG_PASSWORD)          # las variables secretas se mapean explícitamente
                    RESOURCE_GROUP: $(resourceGroup_${{ parameters.entorno }})
                    LOCATION: $(location)
                    CSV_FILE: $(csvFileName)
